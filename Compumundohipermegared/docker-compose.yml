services:
  app:
    build: .
    container_name: fitpower_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    entrypoint: ["/bin/bash", "/var/www/html/docker/php/entrypoint.sh"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      APP_DEBUG: ${APP_DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: fitpower_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - fitpower_mysqldata:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

volumes:
  fitpower_mysqldata:
