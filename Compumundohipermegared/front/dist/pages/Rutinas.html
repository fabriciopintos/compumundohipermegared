<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitPower | Rutinas</title>
  <meta name="description" content="Tus rutinas de entrenamiento en FitPower.">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Antic+Slab&family=Antic+Didone&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dist/css/loader.css">
  <link rel="stylesheet" href="/dist/css/dashboard.css?v=5">
  <link rel="stylesheet" href="/dist/css/rutinas.css?v=2">
  <link rel="stylesheet" href="/dist/css/settings.css?v=6">
  <link rel="stylesheet" href="/dist/css/footer.css?v=4">
  <link rel="stylesheet" href="/dist/css/responsive.css?v=4">
</head>
<body class="dash-user-body">
  <div id="site-loader" aria-busy="true" aria-live="polite">
    <div class="site-loader-inner">
      <div class="site-loader-ring" aria-hidden="true"></div>
      <div class="site-loader-brand">FITPOWER</div>
    </div>
  </div>
  <script>window.__fpLoaderAt = Date.now();</script>
  <script>
    if (!localStorage.getItem('fitpower_token')) {
      window.location.replace('/login');
    }
  </script>

  <nav class="navbar-fitpower">
    <div class="dash-shell nav-shell">
      <a class="brand-title" href="/">FITPOWER</a>
      <button type="button" class="lang-toggle" data-lang-toggle data-i18n="lang.label">ES</button>
      <button class="nav-burger" type="button" id="navBurger" aria-label="Menú" aria-expanded="false" aria-controls="navLinks">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a class="active" href="/rutinas" data-i18n="nav.routines">RUTINAS</a></li>
        <li><a href="/dashboard#actividades" data-i18n="nav.activities">ACTIVIDADES</a></li>
        <li><a href="/dashboard#planes" data-i18n="nav.plans">PLANES</a></li>
        <li><a href="/dashboard#mensajes" data-i18n="nav.messages">MENSAJES</a></li>
        <li><a href="#configuracion" data-open-settings data-i18n="nav.settings">CONFIGURACIÓN</a></li>
        <li><a href="/" id="logout-btn" data-i18n="nav.logout">SALIR</a></li>
      </ul>
    </div>
  </nav>

  <main class="dash-shell">
    <header class="hero" id="contenido" style="padding-bottom: 12px;">
      <div class="hero-copy" style="text-align: left;">
        <h1>
          <span class="welcome-line" data-i18n="dash.routines">RUTINAS</span>
          <span class="usuario" id="nombreUsuario">“USUARIO”</span>
        </h1>
      </div>
    </header>

    <section id="rutinas" class="block-rutinas">
      <div class="rutinas-layout">
        <aside class="rutinas-side" aria-label="Lista de rutinas">
          <h2 class="rutinas-side-title" data-i18n="dash.routines">RUTINAS</h2>
          <div class="rutinas-tabs" id="rutinasTabs" role="tablist"></div>
        </aside>
        <div class="rutinas-panel">
          <div class="rutina-hero" id="rutinaHero">
            <div class="rutina-hero-copy">
              <p class="rutina-kicker" data-i18n="dash.routineLabel">RUTINA</p>
              <h3 class="rutina-title" id="rutinaTitle">FUERZA</h3>
              <p class="rutina-line" id="rutinaLine" aria-hidden="true"></p>
              <p class="rutina-desc" id="rutinaDesc"></p>
              <a class="rutina-video btn-morado" id="rutinaVideo" href="https://www.youtube.com/watch?v=HE45jVN7XKM" target="_blank" rel="noopener noreferrer" data-i18n="dash.routineVideo">Ver video</a>
            </div>
            <div class="rutina-days" id="rutinaDays" role="tablist" aria-label="Días de la rutina"></div>
          </div>
          <div class="rutina-exercises" id="rutinaExercises" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="/dist/js/site.js?v=4"></script>
  <script src="/dist/js/i18n.js?v=6"></script>
  <script src="/dist/js/api.js?v=4"></script>
  <script src="/dist/js/auth.js?v=4"></script>
  <script src="/dist/js/settings.js?v=5"></script>
  <script src="/dist/js/usuario/rutinas.js?v=2"></script>
</body>
</html>
